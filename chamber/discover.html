<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber of Commerce - Discover</title>
    <meta name="description" content="Discover regional attractions, historical landmarks, and business opportunities in the local chamber area.">
    <meta name="author" content="Noel Adonis Suero Lebron">

    <!-- Favicon -->
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Chamber of Commerce - Discover Regional Highlights">
    <meta property="og:description" content="Explore top attractions, cultural landmarks, and local commerce destinations.">
    <meta property="og:image" content="https://yourusername.github.io/wdd231/chamber/images/hero.webp">
    <meta property="og:url" content="https://yourusername.github.io/wdd231/chamber/discover.html">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/discover.css">
    
    <!-- Scripts -->
    <script src="scripts/main.js" defer></script>
    <script type="module" src="scripts/discover.js" defer></script>
</head>

<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <img src="images/logo.svg" alt="Chamber Logo" width="50" height="50">
            <span>Noel Adonis Suero Lebron</span>
        </div>
        <button id="menu-toggle" aria-label="Toggle navigation menu">&#9776;</button>
    </header>

    <!-- Mobile-First Navigation Menu -->
    <nav id="menu" class="hidden">
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="index.html">Chamber</a></li>
            <li><a href="directory.html">Directory</a></li>
            <li><a href="join.html">Join</a></li>
            <li><a href="discover.html" class="active">Discover</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main>
        <div class="discover-header">
            <h1>Discover Our Regional Treasures</h1>
            <p class="subtitle">Uncover historic landmarks, cultural spots, and thriving commercial hubs.</p>
        </div>

        <!-- Dynamic Visitor Frequency Message Banner -->
        <div id="visit-message" class="visit-banner"></div>

        <!-- 8 Items Grid container using HTML-defined Grid Area Template -->
        <section id="discover-grid" class="discover-container" style="
            --area-small: 'area-1' 'area-2' 'area-3' 'area-4' 'area-5' 'area-6' 'area-7' 'area-8';
            --area-medium: 'area-1 area-2' 'area-3 area-3' 'area-4 area-5' 'area-6 area-7' 'area-8 area-8';
            --area-large: 'area-1 area-1 area-2 area-3' 'area-4 area-5 area-5 area-3' 'area-6 area-7 area-8 area-8';
        ">
            <!-- Cards rendered dynamically via discover.js -->
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="footer-socials">
            <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub Profile">
                <img src="images/github.png" alt="GitHub" width="24" height="24">
            </a>
            <a href="https://linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn Profile">
                <img src="images/linked.png" alt="LinkedIn" width="24" height="24">
            </a>
            <a href="https://twitter.com/" target="_blank" rel="noopener" aria-label="Twitter Profile">
                <img src="images/twitter.png" alt="Twitter" width="24" height="24">
            </a>
        </div>

        <div class="footer-info">
            <p>&copy;<span id="currentyear"></span> | Noel Adonis Suero Lebron | Dominican Republic</p>
        </div>

        <div class="footer-modified">
            <p id="lastModified"></p>
        </div>
    </footer>
</body>
</html>
